# ========================================
# Apache Livy Configuration (Modern Stack)
# ========================================

# Server settings
livy.server.host = 0.0.0.0
livy.server.port = 8998
livy.server.session.timeout = 2h
livy.server.session.timeout-check = true
livy.server.session.timeout-check.interval = 1m

# Spark configuration
livy.spark.master = spark://spark-master:7077
livy.spark.deploy-mode = client

# Security (désactivé pour dev local)
livy.server.auth.type = null
livy.server.csrf-protection.enabled = false

# Enable file upload for dependencies
livy.file.local-dir-whitelist = /tmp,/opt/spark/work-dir
livy.repl.enable-hive-context = false

# RSC (Remote Spark Context) configuration
livy.rsc.launcher.port.range = 10000~10100
livy.rsc.jars = local:/opt/livy/rsc-jars/*,local:/opt/livy/repl_2.12-jars/*
livy.rsc.server.connect.timeout = 120s

# Logs
livy.server.access-control.enabled = false
livy.ui.enabled = true

# Performance
livy.server.session.state-retain.sec = 600s
livy.cache-log.size = 200
