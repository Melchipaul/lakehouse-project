services:
  postgres:
    image: postgres:17
    container_name: ${ENV:-preprod}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
    ports:
      - "${POSTGRES_PORT:-6432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ${ENV:-preprod}-minio
    ports:
      - "${MINIO_API_PORT:-20000}:9000"
      - "${MINIO_CONSOLE_PORT:-20001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: ${ENV:-preprod}-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 10;
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/${LAKEHOUSE_BUCKET:-lakehouse-preprod} --ignore-existing;
      mc mb myminio/${WAREHOUSE_BUCKET:-warehouse-preprod} --ignore-existing;
      echo 'Buckets created successfully!';
      exit 0;
      "
    networks:
      - lakehouse

  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: ${ENV:-preprod}-nessie
    ports:
      - "${NESSIE_PORT:-20120}:19120"
    environment:
      nessie.version.store.type: JDBC
      quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lakehouse}
      quarkus.datasource.username: ${POSTGRES_USER:-lakehouse}
      quarkus.datasource.password: ${POSTGRES_PASSWORD}
      quarkus.http.port: 19120
      quarkus.http.host: 0.0.0.0
      quarkus.log.level: INFO
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  spark-master:
    image: apache/spark:3.5.4-python3
    container_name: ${ENV:-preprod}-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "${SPARK_MASTER_PORT:-8077}:7077"
      - "${SPARK_MASTER_UI_PORT:-9080}:8080"
    networks:
      - lakehouse
    depends_on:
      - minio
      - nessie

  spark-worker:
    image: apache/spark:3.5.4-python3
    container_name: ${ENV:-preprod}-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-4}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-4g}
    networks:
      - lakehouse
    depends_on:
      - spark-master

  livy:
    build:
      context: ../livy-custom
      dockerfile: Dockerfile
    image: lakehouse-livy:latest
    container_name: ${ENV:-preprod}-livy
    ports:
      - "${LIVY_PORT:-9998}:8998"
    environment:
      SPARK_MASTER: spark://spark-master:7077
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SPARK_HOME: /opt/spark
      LIVY_HOME: /opt/livy
    networks:
      - lakehouse
    depends_on:
      - spark-master
      - nessie
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8998/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  zeppelin:
    image: lakehouse-zeppelin:latest
    container_name: ${ENV:-preprod}-zeppelin
    ports:
      - "${ZEPPELIN_PORT:-9081}:8080"
    environment:
      ZEPPELIN_ADDR: 0.0.0.0
      ZEPPELIN_NOTEBOOK_DEFAULT_THEME: dark
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ZEPPELIN_INTP_LIVY_URL: http://livy:8998
      ZEPPELIN_INTP_LIVY_SPARK_MASTER: spark://spark-master:7077
    volumes:
      - zeppelin-notebooks:/zeppelin/notebook
    networks:
      - lakehouse
    depends_on:
      - livy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ==========================================
  # DREMIO - SQL Query Engine for Lakehouse
  # ==========================================
  dremio:
    image: dremio/dremio-oss:latest
    container_name: ${ENV:-preprod}-dremio
    ports:
      - "${DREMIO_UI_PORT:-10047}:9047"
      - "${DREMIO_CLIENT_PORT:-41010}:31010"
      - "${DREMIO_FLIGHT_PORT:-42010}:32010"
    environment:
      DREMIO_JAVA_SERVER_EXTRA_OPTS: >-
        -Dpaths.dist=file:///opt/dremio/data/dist
        -Dservices.coordinator.enabled=true
        -Dservices.executor.enabled=true
    volumes:
      - dremio-data:/opt/dremio/data
    networks:
      - lakehouse
    depends_on:
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9047"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ==========================================
  # AIRFLOW - Workflow Orchestration
  # ==========================================
  airflow-init:
    image: apache/airflow:2.10.4
    container_name: ${ENV:-preprod}-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER:-admin} \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@localhost
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    networks:
      - lakehouse
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    image: apache/airflow:2.10.4
    container_name: ${ENV:-preprod}-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-9082}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    volumes:
      - airflow-dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    networks:
      - lakehouse
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    image: apache/airflow:2.10.4
    container_name: ${ENV:-preprod}-airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - airflow-dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    networks:
      - lakehouse
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ==========================================
  # PROMETHEUS - Metrics Collection
  # ==========================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ${ENV:-preprod}-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lakehouse}?sslmode=disable
    networks:
      - lakehouse
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: ${ENV:-preprod}-prometheus
    ports:
      - "${PROMETHEUS_PORT:-10090}:9090"
    volumes:
      - ../../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # GRAFANA - Dashboards & Visualization
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: ${ENV:-preprod}-grafana
    ports:
      - "${GRAFANA_PORT:-4001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - lakehouse
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # SUPERSET - BI & Data Visualization
  # ==========================================
  superset-init:
    build:
      context: ../superset-custom
      dockerfile: Dockerfile
    image: lakehouse-superset:latest
    container_name: ${ENV:-preprod}-superset-init
    command:
      - /bin/bash
      - -c
      - |
        superset db upgrade
        superset fab create-admin \
          --username ${SUPERSET_ADMIN_USER:-admin} \
          --password ${SUPERSET_ADMIN_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --email admin@localhost
        superset init
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-supersetSecretKey}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../config/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    networks:
      - lakehouse
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    build:
      context: ../superset-custom
      dockerfile: Dockerfile
    image: lakehouse-superset:latest
    container_name: ${ENV:-preprod}-superset
    ports:
      - "${SUPERSET_PORT:-9088}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-supersetSecretKey}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../config/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    networks:
      - lakehouse
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres-data:
  minio-data:
  zeppelin-notebooks:
  zeppelin-conf:
  dremio-data:
  airflow-dags:
  airflow-logs:
  prometheus-data:
  grafana-data:

networks:
  lakehouse:
    driver: bridge
